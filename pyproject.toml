[project]
name = "pycache"
version = "0.1.0"
description = "A toy distributed hash table implementing the memcached text protocol"
readme = "README"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
pycache = "pycache:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
